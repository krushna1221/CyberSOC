[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersoc-openenv"
version = "0.2.0"
description = "Autonomous CyberSOC OpenEnv++: a deterministic SOC workflow environment for agent evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CyberSOC-OpenEnv Contributors" }]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "openai>=1.75.0,<3.0.0",
  "openenv-core[core]>=0.2.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0,<9.0.0"]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
include = ["cybersoc_openenv*", "server*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cybersoc_openenv = ["data/*.json", "data/*.md"]
server = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
